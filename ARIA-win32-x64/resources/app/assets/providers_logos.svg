<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>

    <!-- Center Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-openai" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-anthropic" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-gemini" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-nvidia" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-groq" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-ollama" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-aria" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Node and Laser Animations */
    .connector {
      fill: none;
      stroke-linecap: round;
    }
    .pulse-laser {
      stroke-dasharray: 12, 20;
      animation: laser-flow 2.5s linear infinite;
    }
    @keyframes laser-flow {
      to {
        stroke-dashoffset: -64;
      }
    }

    /* Floating / Pulsing Elements */
    .float-item {
      animation: float-slow 4s ease-in-out infinite alternate;
    }
    @keyframes float-slow {
      from { transform: translateY(0px); }
      to { transform: translateY(-6px); }
    }

    .spin-orbit {
      animation: spin-clockwise 20s linear infinite;
      transform-origin: 400px 160px;
    }
    .spin-counter {
      animation: spin-counter 12s linear infinite;
      transform-origin: 400px 160px;
    }
    @keyframes spin-clockwise {
      to { transform: rotate(360deg); }
    }
    @keyframes spin-counter {
      to { transform: rotate(-360deg); }
    }

    .pulse-core {
      animation: pulse-aria 2s ease-in-out infinite alternate;
      transform-origin: 400px 160px;
    }
    @keyframes pulse-aria {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px rgba(59,130,246,0.6)); }
      to { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(139,92,246,0.9)); }
    }

    /* Creative Logo Classes */
    .logo-bg {
      fill: #0d0f17;
      stroke-width: 1.5;
    }
    .logo-txt {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .logo-sub {
      font-family: 'Inter', sans-serif;
      fill: #64748b;
      font-size: 9px;
    }
    
    /* Interactive Hover Effect */
    .provider-group {
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .provider-group:hover {
      transform: scale(1.08);
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="320" rx="16" fill="url(#canvas-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glow Center -->
  <circle cx="400" cy="160" r="180" fill="url(#core-glow)"/>

  <!-- Laser Connectors (shoot towards ARIA center) -->
  <!-- OpenAI (Top Left) -->
  <path d="M 170 85 L 340 135" class="connector pulse-laser" stroke="#10b981" stroke-width="2.5" filter="url(#glow-openai)"/>
  <!-- Anthropic (Left) -->
  <path d="M 150 160 L 330 160" class="connector pulse-laser" stroke="#d97706" stroke-width="2.5" filter="url(#glow-anthropic)"/>
  <!-- Gemini (Bottom Left) -->
  <path d="M 170 235 L 340 185" class="connector pulse-laser" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow-gemini)"/>
  <!-- NVIDIA (Top Right) -->
  <path d="M 630 85 L 460 135" class="connector pulse-laser" stroke="#76b900" stroke-width="2.5" filter="url(#glow-nvidia)"/>
  <!-- Groq (Right) -->
  <path d="M 650 160 L 470 160" class="connector pulse-laser" stroke="#ff4e00" stroke-width="2.5" filter="url(#glow-groq)"/>
  <!-- Ollama (Bottom Right) -->
  <path d="M 630 235 L 460 185" class="connector pulse-laser" stroke="#a21caf" stroke-width="2.5" filter="url(#glow-ollama)"/>

  <!-- ARIA CORE (Center Node) -->
  <!-- Orbiting Particles -->
  <g class="spin-orbit">
    <ellipse cx="400" cy="160" rx="90" ry="40" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6, 12" opacity="0.4"/>
    <circle cx="310" cy="160" r="4.5" fill="#60a5fa" filter="url(#glow-gemini)"/>
    <circle cx="490" cy="160" r="4.5" fill="#f43f5e" filter="url(#glow-groq)"/>
  </g>
  <g class="spin-counter">
    <ellipse cx="400" cy="160" rx="40" ry="90" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4, 8" opacity="0.4"/>
    <circle cx="400" cy="70" r="4" fill="#a78bfa" filter="url(#glow-gemini)"/>
  </g>

  <!-- Central ARIA Shield -->
  <g class="pulse-core">
    <circle cx="400" cy="160" r="45" fill="#030712" stroke="#3b82f6" stroke-width="2" filter="url(#glow-aria)"/>
    <!-- Glowing geometric A logo in center -->
    <path d="M 400 135 L 422 178 L 413 178 L 400 152 L 387 178 L 378 178 Z" fill="#ffffff"/>
    <path d="M 388 163 L 412 163" stroke="#000000" stroke-width="2.5"/>
    <path d="M 388 163 L 412 163" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="400" cy="160" r="2" fill="#ffffff"/>
    <!-- Orbit Ring Outer -->
    <circle cx="400" cy="160" r="50" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="10, 40" opacity="0.8"/>
  </g>


  <!-- PROVIDER LOGOS (Floating Grouped Nodes) -->

  <!-- 1. OPENAI (Top Left) -->
  <g class="provider-group float-item" transform="translate(40, 35)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#10b981" filter="url(#glow-openai)"/>
    <!-- Creative OpenAI Grid/Flower Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <path d="M 15 5 C 10 15, 20 15, 15 25 M 5 15 C 15 10, 15 20, 25 15 M 8 8 C 15 15, 15 15, 22 22 M 8 22 C 15 15, 15 15, 22 8" fill="none" stroke="#10b981" stroke-width="1"/>
      <circle cx="15" cy="15" r="3.5" fill="#10b981"/>
    </g>
    <text x="50" y="34" class="logo-txt">OpenAI</text>
    <text x="50" y="48" class="logo-sub">GPT-4o / o1</text>
    <text x="50" y="58" class="logo-sub" fill="#10b981">Premium API</text>
  </g>

  <!-- 2. ANTHROPIC (Left) -->
  <g class="provider-group float-item" style="animation-delay: -0.7s;" transform="translate(20, 122)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#d97706" filter="url(#glow-anthropic)"/>
    <!-- Anthropic Minimalist A Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#d97706" stroke-width="1.5"/>
      <path d="M 8 25 L 15 5 L 22 25 M 10 19 L 20 19" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="50" y="34" class="logo-txt">Anthropic</text>
    <text x="50" y="48" class="logo-sub">Claude 3.5 Sonnet</text>
    <text x="50" y="58" class="logo-sub" fill="#d97706">Developer SDK</text>
  </g>

  <!-- 3. GEMINI (Bottom Left) -->
  <g class="provider-group float-item" style="animation-delay: -1.4s;" transform="translate(40, 210)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#8b5cf6" filter="url(#glow-gemini)"/>
    <!-- Google Gemini Neon Spark Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
      <path d="M 15 5 Q 15 15, 5 15 Q 15 15, 15 25 Q 15 15, 25 15 Q 15 15, 15 5" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="15" cy="15" r="2" fill="#a78bfa"/>
    </g>
    <text x="50" y="34" class="logo-txt">Google AI</text>
    <text x="50" y="48" class="logo-sub">Gemini 1.5 Pro</text>
    <text x="50" y="58" class="logo-sub" fill="#8b5cf6">Free API tier</text>
  </g>

  <!-- 4. NVIDIA NIM (Top Right) -->
  <g class="provider-group float-item" style="animation-delay: -0.3s;" transform="translate(620, 35)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#76b900" filter="url(#glow-nvidia)"/>
    <!-- NVIDIA Bright Green Spiral Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#76b900" stroke-width="1.5"/>
      <!-- Neon Spiral Details -->
      <path d="M 8 15 C 8 7, 22 7, 22 15 C 22 21, 12 21, 12 15 C 12 11, 18 11, 18 15" fill="none" stroke="#76b900" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="50" y="34" class="logo-txt">NVIDIA NIM</text>
    <text x="50" y="48" class="logo-sub">120+ SaaS Models</text>
    <text x="50" y="58" class="logo-sub" fill="#76b900">Free Credits</text>
  </g>

  <!-- 5. GROQ (Right) -->
  <g class="provider-group float-item" style="animation-delay: -1.1s;" transform="translate(640, 122)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#ff4e00" filter="url(#glow-groq)"/>
    <!-- Groq Geometric Bracket G Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#ff4e00" stroke-width="1.5"/>
      <path d="M 21 9 A 8 8 0 1 0 21 21 L 21 15 L 14 15" fill="none" stroke="#ff4e00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="50" y="34" class="logo-txt">Groq</text>
    <text x="50" y="48" class="logo-sub">Ultra Fast LFS</text>
    <text x="50" y="58" class="logo-sub" fill="#ff4e00">Generous Free</text>
  </g>

  <!-- 6. OLLAMA (Bottom Right) -->
  <g class="provider-group float-item" style="animation-delay: -1.8s;" transform="translate(620, 210)">
    <!-- Container -->
    <rect width="140" height="75" rx="10" class="logo-bg" stroke="#a21caf" filter="url(#glow-ollama)"/>
    <!-- Ollama Llama Silhouette/Geometric Logo -->
    <g transform="translate(15, 23)">
      <circle cx="15" cy="15" r="14" fill="none" stroke="#a21caf" stroke-width="1.5"/>
      <!-- stylized llama ears & face outline -->
      <path d="M 11 11 L 11 20 L 19 20 L 19 14 L 16 11 Z" fill="none" stroke="#a21caf" stroke-width="1.8"/>
      <path d="M 13 11 L 13 8 M 17 11 L 17 8" stroke="#a21caf" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="50" y="34" class="logo-txt">Ollama</text>
    <text x="50" y="48" class="logo-sub">Local Offline LLMs</text>
    <text x="50" y="58" class="logo-sub" fill="#a21caf">100% Free &amp; Offline</text>
  </g>

</svg>
