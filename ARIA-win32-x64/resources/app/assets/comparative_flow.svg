<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .flow-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .line-cyan {
      stroke: #00d2ff;
      stroke-dasharray: 8, 12;
      animation: flow-forward 2.5s linear infinite;
    }
    .line-purple {
      stroke: #d946ef;
      stroke-dasharray: 8, 12;
      animation: flow-forward 2.5s linear infinite;
    }
    .line-amber {
      stroke: #f59e0b;
      stroke-dasharray: 8, 12;
      animation: flow-forward 2.5s linear infinite;
    }

    @keyframes flow-forward {
      to {
        stroke-dashoffset: -40;
      }
    }

    .pulse-node {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .txt-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 14px;
    }
    .txt-body {
      font-family: 'Inter', sans-serif;
      fill: #94a3b8;
      font-size: 10px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="220" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Paths -->
  <!-- User Query to Model A -->
  <path d="M 175 110 Q 230 45 365 45" class="flow-line line-cyan" filter="url(#glow-cyan)"/>
  <!-- User Query to Model B -->
  <path d="M 175 110 L 365 110" class="flow-line line-purple" filter="url(#glow-purple)"/>
  <!-- User Query to Model C -->
  <path d="M 175 110 Q 230 175 365 175" class="flow-line line-amber" filter="url(#glow-amber)"/>

  <!-- Model A to Comparison Panel -->
  <path d="M 495 45 Q 560 45 615 110" class="flow-line line-cyan" filter="url(#glow-cyan)"/>
  <!-- Model B to Comparison Panel -->
  <path d="M 495 110 L 615 110" class="flow-line line-purple" filter="url(#glow-purple)"/>
  <!-- Model C to Comparison Panel -->
  <path d="M 495 175 Q 560 175 615 110" class="flow-line line-amber" filter="url(#glow-amber)"/>

  <!-- Left Node: USER QUERY -->
  <g class="pulse-node" transform="translate(40, 65)">
    <rect width="135" height="90" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="18" fill="url(#blue-grad)"/>
    <!-- Chat Bubble Icon -->
    <path d="M 30 41 L 40 41 M 30 45 L 36 45 M 33 49 L 33 49" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="65" y="42" class="txt-title">User Prompt</text>
    <text x="65" y="58" class="txt-body">Coding query or</text>
    <text x="65" y="70" class="txt-body">task request</text>
  </g>

  <!-- Middle Nodes: Parallel Models -->
  <!-- Model A (Top) -->
  <g transform="translate(365, 20)">
    <rect width="130" height="50" rx="8" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" filter="url(#glow-cyan)" opacity="0.9"/>
    <text x="65" y="24" text-anchor="middle" class="txt-title">Gemini 1.5 Pro</text>
    <text x="65" y="38" text-anchor="middle" class="txt-body">Execution A</text>
  </g>
  <!-- Model B (Middle) -->
  <g transform="translate(365, 85)">
    <rect width="130" height="50" rx="8" fill="#0f172a" stroke="#d946ef" stroke-width="1.5" filter="url(#glow-purple)" opacity="0.9"/>
    <text x="65" y="24" text-anchor="middle" class="txt-title">GPT-4o</text>
    <text x="65" y="38" text-anchor="middle" class="txt-body">Execution B</text>
  </g>
  <!-- Model C (Bottom) -->
  <g transform="translate(365, 150)">
    <rect width="130" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow-amber)" opacity="0.9"/>
    <text x="65" y="24" text-anchor="middle" class="txt-title">Claude 3.5 Sonnet</text>
    <text x="65" y="38" text-anchor="middle" class="txt-body">Execution C</text>
  </g>

  <!-- Right Node: COMPARISON CANVAS -->
  <g class="pulse-node" transform="translate(615, 65)">
    <rect width="145" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <circle cx="35" cy="45" r="18" fill="url(#purple-grad)"/>
    <!-- Layout Grid Icon -->
    <rect x="27" y="37" width="7" height="16" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="37" y="37" width="7" height="16" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="65" y="42" class="txt-title">Compare View</text>
    <text x="65" y="58" class="txt-body">Side-by-side</text>
    <text x="65" y="70" class="txt-body">output panels</text>
  </g>
</svg>
