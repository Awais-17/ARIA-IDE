<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .flow-line {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .line-blue {
      stroke: #00d2ff;
      stroke-dasharray: 8, 12;
      animation: flow-forward 2.5s linear infinite;
    }
    .line-green {
      stroke: #10b981;
      stroke-dasharray: 8, 12;
      animation: flow-forward 2.5s linear infinite;
    }
    @keyframes flow-forward {
      to {
        stroke-dashoffset: -40;
      }
    }

    .pulse-lock {
      animation: pulse-lock 1.5s infinite alternate ease-in-out;
      transform-origin: 575px 100px;
    }
    @keyframes pulse-lock {
      from { transform: scale(1); filter: drop-shadow(0 0 2px rgba(16,185,129,0.5)); }
      to { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(16,185,129,0.8)); }
    }

    .txt-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 14px;
    }
    .txt-body {
      font-family: 'Inter', sans-serif;
      fill: #94a3b8;
      font-size: 10px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="200" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Paths -->
  <!-- Cloud API Providers to Secure Storage -->
  <path d="M 205 60 C 330 60 380 100 500 100" class="flow-line line-blue" filter="url(#glow-blue)"/>
  <!-- Local Models to Secure Storage -->
  <path d="M 205 140 C 330 140 380 100 500 100" class="flow-line line-blue" filter="url(#glow-blue)"/>

  <!-- Left Node 1: Cloud Providers -->
  <g transform="translate(45, 20)">
    <rect width="160" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="url(#blue-grad)"/>
    <!-- Cloud Icon -->
    <path d="M 24 38 A 6 6 0 0 1 25 26 A 9 9 0 0 1 37 28 A 6 6 0 0 1 36 38 Z" fill="#ffffff"/>
    <text x="60" y="32" class="txt-title">Cloud APIs</text>
    <text x="60" y="48" class="txt-body">OpenAI, Anthropic,</text>
    <text x="60" y="58" class="txt-body">Gemini, DeepSeek...</text>
  </g>

  <!-- Left Node 2: Local Endpoints -->
  <g transform="translate(45, 110)">
    <rect width="160" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="16" fill="url(#blue-grad)"/>
    <!-- Terminal Icon -->
    <path d="M 23 30 L 29 35 L 23 40 M 31 40 L 37 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="32" class="txt-title">Local Models</text>
    <text x="60" y="48" class="txt-body">Ollama, LM Studio,</text>
    <text x="60" y="58" class="txt-body">Custom endpoints...</text>
  </g>

  <!-- Right Node: SECURE STORAGE & LOCAL ENCRYPTION -->
  <g transform="translate(500, 45)">
    <rect width="250" height="110" rx="12" fill="#0c111d" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
    
    <!-- Padlock Graphic -->
    <g class="pulse-lock">
      <circle cx="75" cy="55" r="22" fill="url(#green-grad)"/>
      <!-- Lock Shackle -->
      <path d="M 67 52 L 67 44 A 8 8 0 0 1 83 44 L 83 52" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Lock Body -->
      <rect x="63" y="51" width="24" height="18" rx="3" fill="#ffffff"/>
      <!-- Keyhole -->
      <circle cx="75" cy="59" r="2.5" fill="#10b981"/>
      <path d="M 75 60 L 75 66" stroke="#10b981" stroke-width="1.5"/>
    </g>

    <text x="115" y="40" class="txt-title">Local Encryption</text>
    <text x="115" y="58" class="txt-body">Saved in your user profile:</text>
    <text x="115" y="70" class="txt-body" fill="#10b981">helios-settings.json</text>
    <text x="115" y="85" class="txt-body" fill="#ef4444">0% sent to external servers</text>
  </g>
</svg>
